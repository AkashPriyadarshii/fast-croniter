<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-start infinite;
      }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="8" y="8" width="824" height="404" rx="12" fill="#090c10" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  <line x1="20" y1="9" x2="820" y2="9" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Window Header / Titlebar -->
  <path d="M 8 20 C 8 13.373 13.373 8 20 8 L 820 8 C 826.627 8 832 13.373 832 20 L 832 46 L 8 46 Z" fill="#131720" />
  <line x1="8" y1="46" x2="832" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="32" cy="27" r="5.5" fill="#ff5f56" />
  <circle cx="50" cy="27" r="5.5" fill="#ffbd2e" />
  <circle cx="68" cy="27" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text class="mono" x="420" y="32" fill="#8b949e" font-size="12" font-weight="500" text-anchor="middle">fast-croniter — pytest tests/ &amp; python benchmark.py</text>

  <!-- Terminal Content Body -->
  <g transform="translate(32, 74)" class="mono" font-size="13">
    <!-- Command 1: Pytest execution -->
    <text y="0">
      <tspan fill="#38bdf8" font-weight="700">akash@zenith</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#818cf8">~/fast-croniter</tspan><tspan fill="#f0f6fc">$ pytest tests/ -q</tspan>
    </text>

    <text y="24" fill="#6e7681">collected 267 items</text>

    <text y="48">
      <tspan fill="#8b949e">tests/test_croniter.py </tspan>
      <tspan fill="#34d399">.................................................. [ 38%]</tspan>
    </text>

    <text y="70">
      <tspan fill="#8b949e">tests/test_croniter_dst_repetition.py </tspan>
      <tspan fill="#34d399">.......................................... [ 72%]</tspan>
    </text>

    <text y="92">
      <tspan fill="#8b949e">tests/test_croniter_hash.py </tspan>
      <tspan fill="#34d399">.................................................... [100%]</tspan>
    </text>

    <text y="118">
      <tspan fill="#34d399" font-weight="700">================== 267 passed, 890 subtests passed in 1.09s ==================</tspan>
    </text>

    <!-- Command 2: Live Benchmark -->
    <text y="154">
      <tspan fill="#38bdf8" font-weight="700">akash@zenith</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#818cf8">~/fast-croniter</tspan><tspan fill="#f0f6fc">$ python benchmark.py</tspan>
    </text>

    <text y="180" fill="#6e7681">Running 10,000 iterations per scenario (CPython vs Rust/PyO3)...</text>

    <text y="204">
      <tspan fill="#f0f6fc">01. Simple Step (*/5 * * * *)      </tspan>
      <tspan fill="#38bdf8"> 807,683 ops/sec </tspan>
      <tspan fill="#34d399" font-weight="700">[ 20.9x faster ]</tspan>
    </text>

    <text y="226">
      <tspan fill="#f0f6fc">02. Hourly Range (0 0-23/2 * * mon)</tspan>
      <tspan fill="#38bdf8"> 916,271 ops/sec </tspan>
      <tspan fill="#34d399" font-weight="700">[ 36.7x faster ]</tspan>
    </text>

    <text y="248">
      <tspan fill="#f0f6fc">03. Complex Mask (15 2,4,6 1-15...)</tspan>
      <tspan fill="#38bdf8"> 375,506 ops/sec </tspan>
      <tspan fill="#34d399" font-weight="700">[ 38.0x faster ]</tspan>
    </text>

    <text y="270">
      <tspan fill="#f0f6fc">04. Validation (croniter.is_valid) </tspan>
      <tspan fill="#38bdf8"> 223,097 ops/sec </tspan>
      <tspan fill="#34d399" font-weight="700">[ 29.4x faster ]</tspan>
    </text>

    <!-- Active prompt with blinking cursor -->
    <text y="306">
      <tspan fill="#38bdf8" font-weight="700">akash@zenith</tspan><tspan fill="#6e7681">:</tspan><tspan fill="#818cf8">~/fast-croniter</tspan><tspan fill="#f0f6fc">$ </tspan><tspan class="cursor" fill="#38bdf8">█</tspan>
    </text>
  </g>
</svg>
