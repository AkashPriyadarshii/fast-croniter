<svg fill="none" viewBox="0 0 720 280" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .terminal {
          background-color: #0b0f19;
          font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
          border: 1px solid rgba(255, 255, 255, 0.08);
          height: 260px;
          box-sizing: border-box;
        }
        .header {
          background-color: #111827;
          padding: 10px 16px;
          display: flex;
          align-items: center;
          gap: 8px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .red { background-color: #ef4444; }
        .yellow { background-color: #f59e0b; }
        .green { background-color: #10b981; }
        .title {
          color: #94a3b8;
          font-size: 12px;
          margin-left: auto;
          margin-right: auto;
          font-weight: 500;
          letter-spacing: 0.5px;
        }
        .body {
          padding: 18px 20px;
          color: #f8fafc;
          font-size: 13.5px;
          line-height: 1.6;
        }
        .prompt { color: #38bdf8; font-weight: 600; }
        .cmd-line {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          border-right: 2px solid #38bdf8;
          width: 0;
          animation: typing 2.2s steps(35, end) forwards, blink 0.8s step-end infinite;
          vertical-align: bottom;
        }
        .output-block {
          color: #94a3b8;
          opacity: 0;
          animation: fadeIn 0.4s ease-in-out 2.3s forwards;
          margin-top: 10px;
        }
        .success { color: #34d399; font-weight: 500; }
        @keyframes typing {
          from { width: 0 }
          to { width: 100% }
        }
        @keyframes blink {
          from, to { border-color: transparent }
          50% { border-color: #38bdf8; }
        }
        @keyframes fadeIn {
          to { opacity: 1; }
        }
      </style>

      <div class="terminal">
        <div class="header">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="title">fast-croniter</span>
        </div>
        <div class="body">
          <div><span class="prompt">$ </span><span class="cmd-line">pytest</span></div>
          <div class="output-block">
            <div class="success">✔</div>
            <div>🚀</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>