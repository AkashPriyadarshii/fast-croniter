<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-start infinite;
      }
    </style>
  </defs>

  <!-- Terminal Window Shadow / Outer Border -->
  <rect x="10" y="10" width="820" height="380" rx="10" fill="#0b0f17" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header / Titlebar -->
  <path d="M 10 20 C 10 14.477 14.477 10 20 10 L 820 10 C 825.523 10 830 14.477 830 20 L 830 46 L 10 46 Z" fill="#161e2e" />
  <line x1="10" y1="46" x2="830" y2="46" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="32" cy="28" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="52" cy="28" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="72" cy="28" r="6" fill="#10b981" opacity="0.85" />

  <!-- Window Title -->
  <text class="mono" x="420" y="32" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">fast-croniter — bash — 840x400</text>

  <!-- Terminal Body Content -->
  <g transform="translate(32, 74)" class="mono" font-size="13">
    <!-- Command 1: Pytest run -->
    <text y="0">
      <tspan fill="#38bdf8" font-weight="700">akash@zenith</tspan><tspan fill="#64748b">:</tspan><tspan fill="#818cf8">~/workspace/fast-croniter</tspan><tspan fill="#f8fafc">$ pytest tests/ -q</tspan>
    </text>

    <!-- Output lines -->
    <text y="24" fill="#64748b">collected 267 items</text>

    <text y="48">
      <tspan fill="#94a3b8">tests/test_croniter.py </tspan>
      <tspan fill="#34d399">.................................................. [ 24%]</tspan>
    </text>

    <text y="70">
      <tspan fill="#94a3b8">tests/test_croniter_dst_repetition.py </tspan>
      <tspan fill="#34d399">................................. [ 51%]</tspan>
    </text>

    <text y="92">
      <tspan fill="#94a3b8">tests/test_croniter_hash.py </tspan>
      <tspan fill="#34d399">........................................... [100%]</tspan>
    </text>

    <text y="118">
      <tspan fill="#34d399" font-weight="700">============== 267 passed, 890 subtests passed in 1.15s ==============</tspan>
    </text>

    <!-- Command 2: Benchmark run -->
    <text y="152">
      <tspan fill="#38bdf8" font-weight="700">akash@zenith</tspan><tspan fill="#64748b">:</tspan><tspan fill="#818cf8">~/workspace/fast-croniter</tspan><tspan fill="#f8fafc">$ python benchmark.py</tspan>
    </text>

    <!-- Benchmark Table Output -->
    <text y="178" fill="#64748b">Running 10,000 iterations per scenario against upstream cpython croniter...</text>

    <text y="202">
      <tspan fill="#f8fafc">01. Simple Step (*/5 * * * *)      </tspan>
      <tspan fill="#38bdf8"> 807,683 ops/sec </tspan>
      <tspan fill="#34d399" font-weight="700">[ 20.9x faster ]</tspan>
    </text>

    <text y="224">
      <tspan fill="#f8fafc">02. Hourly Range (0 0-23/2 * * mon)</tspan>
      <tspan fill="#38bdf8"> 916,271 ops/sec </tspan>
      <tspan fill="#34d399" font-weight="700">[ 36.7x faster ]</tspan>
    </text>

    <text y="246">
      <tspan fill="#f8fafc">03. Complex Mask (15 2,4,6 1-15...)</tspan>
      <tspan fill="#38bdf8"> 375,506 ops/sec </tspan>
      <tspan fill="#34d399" font-weight="700">[ 38.0x faster ]</tspan>
    </text>

    <text y="268">
      <tspan fill="#f8fafc">04. Validation (croniter.is_valid) </tspan>
      <tspan fill="#38bdf8"> 223,097 ops/sec </tspan>
      <tspan fill="#34d399" font-weight="700">[ 29.4x faster ]</tspan>
    </text>

    <!-- Active prompt line with cursor -->
    <text y="302">
      <tspan fill="#38bdf8" font-weight="700">akash@zenith</tspan><tspan fill="#64748b">:</tspan><tspan fill="#818cf8">~/workspace/fast-croniter</tspan><tspan fill="#f8fafc">$ </tspan><tspan class="cursor" fill="#38bdf8">█</tspan>
    </text>
  </g>
</svg>
