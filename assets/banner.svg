<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#canvas-bg)" />
  <rect width="1280" height="640" fill="url(#grid-pattern)" />

  <circle cx="1080" cy="120" r="260" fill="#38bdf8" opacity="0.12" filter="blur(80px)" />
  <circle cx="220" cy="520" r="280" fill="#818cf8" opacity="0.10" filter="blur(90px)" />

  <g transform="translate(80, 80)">
    <rect width="1120" height="480" rx="20" fill="#111827" fill-opacity="0.75" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />
    <rect x="0" y="0" width="1120" height="5" rx="2.5" fill="url(#accent-glow)" />

    <g transform="translate(70, 70)">
      <rect width="140" height="34" rx="17" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="70" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.2">RUST + PYO3</text>
    </g>

    <text x="70" y="185" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.8">
      fast-croniter
    </text>

    <text x="70" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      High-performance drop-in Rust replacement for Python croniter
    </text>

    <g transform="translate(70, 365)">
      <circle cx="16" cy="16" r="16" fill="url(#accent-glow)" />
      <text x="46" y="23" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
        github.com/AkashPriyadarshii/fast-croniter
      </text>
    </g>
  </g>
</svg>