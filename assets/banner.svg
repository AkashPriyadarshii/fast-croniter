<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Geist Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="#0b0f17" />

  <!-- Outer hairline container -->
  <rect x="24" y="24" width="1232" height="592" rx="12" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- LEFT COLUMN: Value Proposition & Engineering Metrics -->
  <!-- Tag / Badges -->
  <rect x="72" y="80" width="170" height="28" rx="4" fill="#161e2e" stroke="#334155" stroke-width="1" />
  <text class="mono" x="157" y="98" fill="#38bdf8" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="middle">RUST ABI3 · PYO3</text>

  <rect x="254" y="80" width="140" height="28" rx="4" fill="#161e2e" stroke="#334155" stroke-width="1" />
  <text class="mono" x="324" y="98" fill="#34d399" font-size="11" font-weight="600" letter-spacing="1.2" text-anchor="middle">PYTHON 3.8 – 3.13</text>

  <!-- Title -->
  <text class="sans" x="72" y="172" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="-1.5">fast-croniter</text>

  <!-- Subtitle -->
  <text class="sans" x="72" y="214" fill="#94a3b8" font-size="19" font-weight="400">Drop-in Rust replacement for Python's croniter engine.</text>
  <text class="sans" x="72" y="240" fill="#64748b" font-size="15" font-weight="400">Zero Python dependencies · Exact ABI &amp; upstream bug-for-bug compatibility.</text>

  <!-- Metrics Grid -->
  <g transform="translate(72, 280)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="180" height="116" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text class="sans" x="20" y="44" fill="#38bdf8" font-size="34" font-weight="800" letter-spacing="-0.5">38.0x</text>
    <text class="sans" x="20" y="74" fill="#f8fafc" font-size="13" font-weight="600">Peak Speedup</text>
    <text class="sans" x="20" y="94" fill="#64748b" font-size="11" font-weight="400">vs CPython croniter</text>

    <!-- Metric 2 -->
    <rect x="196" y="0" width="180" height="116" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text class="sans" x="216" y="44" fill="#34d399" font-size="34" font-weight="800" letter-spacing="-0.5">267/267</text>
    <text class="sans" x="216" y="74" fill="#f8fafc" font-size="13" font-weight="600">Upstream Tests</text>
    <text class="sans" x="216" y="94" fill="#64748b" font-size="11" font-weight="400">100% pass rate</text>

    <!-- Metric 3 -->
    <rect x="392" y="0" width="180" height="116" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text class="sans" x="412" y="44" fill="#f59e0b" font-size="34" font-weight="800" letter-spacing="-0.5">916k</text>
    <text class="sans" x="412" y="74" fill="#f8fafc" font-size="13" font-weight="600">Ops / Second</text>
    <text class="sans" x="412" y="94" fill="#64748b" font-size="11" font-weight="400">sustained throughput</text>
  </g>

  <!-- Author & Repo Signature -->
  <g transform="translate(72, 440)">
    <line x1="0" y1="0" x2="572" y2="0" stroke="#1e293b" stroke-width="1" />
    <text class="mono" x="0" y="36" fill="#64748b" font-size="12">ENGINEER</text>
    <text class="sans" x="0" y="58" fill="#cbd5e1" font-size="14" font-weight="600">Akash Priyadarshi</text>
    <text class="mono" x="0" y="76" fill="#64748b" font-size="12">akashpriyadarshi.is-a.dev</text>

    <text class="mono" x="320" y="36" fill="#64748b" font-size="12">REPOSITORY</text>
    <text class="mono" x="320" y="58" fill="#38bdf8" font-size="13" font-weight="600">AkashPriyadarshii/fast-croniter</text>
    <text class="mono" x="320" y="76" fill="#64748b" font-size="12">MIT / Apache-2.0 Dual License</text>
  </g>

  <!-- RIGHT COLUMN: Code Card Preview -->
  <g transform="translate(684, 80)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="524" height="472" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

    <!-- Card Header / Title bar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 514 0 C 519.523 0 524 4.477 524 10 L 524 40 L 0 40 Z" fill="#161e2e" />
    <line x1="0" y1="40" x2="524" y2="40" stroke="#1e293b" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="20" cy="20" r="5.5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="20" r="5.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="20" r="5.5" fill="#10b981" opacity="0.8" />

    <text class="mono" x="262" y="24" fill="#94a3b8" font-size="12" text-anchor="middle">example.py</text>

    <!-- Code Content -->
    <g transform="translate(24, 68)" class="mono" font-size="13.5">
      <!-- Line 1 -->
      <text y="0">
        <tspan fill="#f43f5e">from</tspan>
        <tspan fill="#f8fafc"> fast_croniter </tspan>
        <tspan fill="#f43f5e">import</tspan>
        <tspan fill="#38bdf8"> croniter</tspan>
      </text>

      <!-- Line 2 -->
      <text y="26">
        <tspan fill="#f43f5e">import</tspan>
        <tspan fill="#f8fafc"> datetime</tspan>
      </text>

      <!-- Line 3 (comment) -->
      <text y="62" fill="#64748b"># Exact drop-in replacement: zero code changes</text>

      <!-- Line 4 -->
      <text y="88">
        <tspan fill="#f8fafc">base = datetime.datetime(</tspan><tspan fill="#f59e0b">2024</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#f59e0b">1</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#f59e0b">1</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#f59e0b">0</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#f59e0b">0</tspan><tspan fill="#f8fafc">)</tspan>
      </text>

      <!-- Line 5 -->
      <text y="114">
        <tspan fill="#f8fafc">iter = </tspan><tspan fill="#38bdf8">croniter</tspan><tspan fill="#f8fafc">(</tspan><tspan fill="#34d399">"*/5 * * * *"</tspan><tspan fill="#f8fafc">, base)</tspan>
      </text>

      <!-- Line 6 -->
      <text y="140">
        <tspan fill="#f8fafc">next_dt = iter.</tspan><tspan fill="#60a5fa">get_next</tspan><tspan fill="#f8fafc">(datetime.datetime)</tspan>
      </text>

      <!-- Divider inside card -->
      <line x1="0" y1="172" x2="476" y2="172" stroke="#1e293b" stroke-width="1" />

      <!-- Benchmark result block -->
      <rect x="0" y="192" width="476" height="152" rx="6" fill="#0b0f17" stroke="#1e293b" stroke-width="1" />

      <text x="16" y="222" fill="#64748b" font-size="11.5" letter-spacing="1">BENCHMARK (10,000 ITERATIONS)</text>

      <text x="16" y="254" fill="#94a3b8" font-size="12.5">
        <tspan fill="#ef4444">croniter (Python):</tspan>
        <tspan fill="#94a3b8">  24,950 ops/sec</tspan>
      </text>

      <text x="16" y="280" fill="#94a3b8" font-size="12.5">
        <tspan fill="#34d399">fast-croniter (Rust):</tspan>
        <tspan fill="#f8fafc" font-weight="700"> 916,271 ops/sec</tspan>
      </text>

      <text x="16" y="316" fill="#38bdf8" font-size="13" font-weight="700">
        Result: 36.7x faster · 100% identical timestamps
      </text>
    </g>
  </g>
</svg>
