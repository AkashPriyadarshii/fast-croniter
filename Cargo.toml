[package]
name = "fast-croniter"
version = "0.2.0"
edition = "2024"
authors = ["Akash Priyadarshi <272530059+AkashPriyadarshii@users.noreply.github.com>"]
description = "Fast, memory-safe, drop-in Rust replacement for Python croniter with PyO3 bindings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkashPriyadarshii/fast-croniter"
homepage = "https://fast-croniter-site.vercel.app"
keywords = ["cron", "croniter", "pyo3", "scheduler", "airflow"]

[lib]
name = "fast_croniter"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["chrono", "abi3-py38"] }
chrono = "0.4"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
