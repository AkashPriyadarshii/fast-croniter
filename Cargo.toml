[package]
name = "fast-croniter"
version = "0.1.0"
edition = "2024"

[lib]
name = "fast_croniter"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["chrono", "extension-module", "abi3-py38"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = { version = "4.0.3", features = ["chrono"] }
thiserror = "2.0"
