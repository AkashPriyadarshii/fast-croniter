name: Feature Request
description: Propose a new feature, platform port, or performance optimization
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Feature requests should preserve or expand compatibility with upstream cron specifications.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What limitation or bottleneck are you encountering?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How should `fast-croniter` address this?
    validations:
      required: true
